name: CI pipeline
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  manifest-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.37.0

      - name: Render local catalog manifests
        run: >-
          kubectl kustomize deploy/k8s/overlays/local/catalog
          > "$RUNNER_TEMP/catalog-manifests.yaml"

      - name: Validate rendered manifests
        run: >-
          docker run --rm
          --volume "$RUNNER_TEMP:/manifests:ro"
          ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary /manifests/catalog-manifests.yaml

  go-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Check module files
        run: go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files requiring gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  compose-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate local Compose configuration
        run: LOCAL_ENV_FILE=.env.local.example make local-config

      - name: Build and smoke test local stack
        run: LOCAL_ENV_FILE=.env.local.example make local-verify

      - name: Stop local stack
        if: always()
        run: LOCAL_ENV_FILE=.env.local.example make local-down
